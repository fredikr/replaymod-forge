// Forge 1.21.11 port of ReplayMod (https://github.com/ReplayMod/ReplayMod), GPL-3.0-or-later.
plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = "${minecraft_version}-${mod_version}-forge"
group = 'com.replaymod'
base.archivesName = 'replaymod'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def mixinConfigs = [
        'mixins.jgui.json',
        'mixins.compat.mapwriter.replaymod.json',
        'mixins.compat.shaders.replaymod.json',
        'mixins.core.replaymod.json',
        'mixins.extras.playeroverview.replaymod.json',
        'mixins.recording.replaymod.json',
        'mixins.render.blend.replaymod.json',
        'mixins.render.replaymod.json',
        'mixins.replay.replaymod.json',
]

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\..*' }
    }
}

configurations {
    // Libraries which get relocated into com.replaymod.lib and bundled into the mod jar
    shade
    compileOnly.extendsFrom shade
    // Note: runClient in this project does not work, the unrelocated libraries clash in the Java module system.
    // To test, put build/libs/replaymod-*-forge.jar into the mods folder of a Forge 1.21.11 instance.
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // Forge 1.21.11 ships and bootstraps MixinExtras itself
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'

    shade 'com.googlecode.mp4parser:isoparser:1.1.7'
    shade 'org.apache.commons:commons-exec:1.3'
    shade 'com.google.apis:google-api-services-youtube:v3-rev178-1.22.0'
    shade 'com.google.api-client:google-api-client-gson:1.20.0'
    shade 'com.google.api-client:google-api-client-java6:1.20.0'
    shade 'com.google.oauth-client:google-oauth-client-jetty:1.20.0'
    shade 'com.github.javagl.JglTF:jgltf-model:3af6de4'
    shade 'org.aspectj:aspectjrt:1.8.2'
    shade 'com.github.ReplayMod.JavaBlend:2.79.0:a0696f8'
    shade 'com.github.ReplayMod:lwjgl-utils:27dcd66'

    // ReplayStudio (built from the ReplayMod repo) and its dependencies
    shade files('libs/ReplayStudio.jar')
    shade 'com.github.viaversion:opennbt:0a02214'
    shade 'org.apache.commons:commons-lang3:3.3.2'
    shade 'org.apache.commons:commons-collections4:4.0'
    shade 'commons-cli:commons-cli:1.2'

    // Natives are loaded at runtime from the bundled com/replaymod/render/utils/lwjgl.jar
    compileOnly 'org.lwjgl:lwjgl-tinyexr:3.3.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000' << '-nowarn'
}

processResources {
    def props = [version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'slim'
    manifest { attributes(['MixinConfigs': mixinConfigs.join(',')]) }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = null
    configurations = [project.configurations.shade]
    manifest { attributes(['MixinConfigs': mixinConfigs.join(',')]) }

    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class',
            'META-INF/versions/**', 'META-INF/maven/**', 'META-INF/native-image/**', 'META-INF/proguard/**'

    // MC provides these
    relocate 'com.github.steveice10.netty', 'io.netty'
    exclude 'com/github/steveice10/netty/**'
    exclude 'it/unimi/dsi/fastutil/**'
    exclude 'javax/annotation/**', 'com/google/common/**', 'com/google/gson/**', 'org/slf4j/**', 'org/checkerframework/**', 'com/google/errorprone/**', 'com/google/j2objc/**'
    dependencies {
        exclude(dependency('com.google.guava:.*'))
        exclude(dependency('com.google.code.gson:.*'))
        exclude(dependency('it.unimi.dsi:.*'))
        exclude(dependency('com.google.code.findbugs:.*'))
        exclude(dependency('org.slf4j:.*'))
    }

    [
            'com.coremedia', 'com.fasterxml', 'com.github', 'com.google.api', 'com.google.thirdparty',
            'com.googlecode', 'com.mp4parser', 'com.viaversion', 'de.javagl',
            'org.apache.commons.cli', 'org.apache.commons.codec', 'org.apache.commons.collections4',
            'org.apache.commons.exec', 'org.apache.commons.lang3', 'org.apache.commons.logging',
            'org.apache.http', 'org.aspectj', 'org.blender', 'org.cakelab',
            'org.codehaus', 'org.mortbay', 'org.xbill', 'javax.servlet', 'mcstructs',
    ].each { pkg -> relocate pkg, "com.replaymod.lib.$pkg" }

    // No minimize(): JavaBlend and the Google API client load classes via reflection
    mergeServiceFiles()
}

tasks.named('assemble') { dependsOn 'shadowJar' }
